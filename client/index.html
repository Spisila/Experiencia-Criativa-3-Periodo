<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SindromeX</title>
</head>

<body>

  <div class="whole">

    <header class="app-header">

      <button class="icon-btn" id="btn-back" title="Voltar">
        <img class="icon_image" src="/node_modules/lucide-static/icons/arrow-big-left.svg"
          style="height: 100%; width: 100%;" alt="">
      </button>

      <div class="header-title">LOGIN</div>

      <div class="header-actions">

        <button class="icon-btn" id="btn-theme-toggle" title="Alternar Tema">
          <img class="icon_image" src="/node_modules/lucide-static/icons/moon.svg" id="theme_icon"
            style="height: 100%; width: 100%;" alt="">
        </button>

        <button class="icon-btn" title="Perfil">
          <img class="icon_image" src="/node_modules/lucide-static/icons/user.svg" style="height: 100%; width: 100%;"
            alt="">
        </button>

      </div>
    </header>

    <main class="main-content-area">

      <div id="app">
      </div>

    </main>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
